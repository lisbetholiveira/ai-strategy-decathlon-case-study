  <rect x="125" y="397" width="950" height="50" rx="14" fill="#ffffff" stroke="#b9ccff"/>
  <text x="600" y="428" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#2257c7">Goal: the right experience for the right customer at the right time — with measurable impact.</text>
