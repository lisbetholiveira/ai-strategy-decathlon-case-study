<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <rect width="1200" height="500" fill="#ffffff"/>
  <rect x="22" y="22" width="1156" height="456" rx="24" fill="#f8fafc" stroke="#dbe4f0"/>
  <text x="60" y="76" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#172554">AI FOR CUSTOMER EXPERIENCE</text>
  <text x="60" y="106" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475569">Turning data into relevant experiences — and measurable business value</text>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <circle cx="140" cy="230" r="62" fill="#e7efff" stroke="#b9ccff"/><text x="140" y="222" font-size="20" font-weight="700" fill="#2257c7">CUSTOMER</text><text x="140" y="247" font-size="20" font-weight="700" fill="#2257c7">DATA</text>
    <text x="140" y="325" font-size="14" fill="#475569">Purchases · behaviour</text><text x="140" y="346" font-size="14" fill="#475569">preferences · context</text>

    <circle cx="370" cy="230" r="62" fill="#e6fbf7" stroke="#aee7dc"/><text x="370" y="222" font-size="20" font-weight="700" fill="#0f766e">AI</text><text x="370" y="247" font-size="20" font-weight="700" fill="#0f766e">ENGINE</text>
    <text x="370" y="325" font-size="14" fill="#475569">ML · predictive models</text><text x="370" y="346" font-size="14" fill="#475569">segmentation · NLP</text>

    <circle cx="600" cy="230" r="62" fill="#f2f9df" stroke="#d5e9a7"/><text x="600" y="218" font-size="18" font-weight="700" fill="#4d7c0f">PERSONALISED</text><text x="600" y="243" font-size="18" font-weight="700" fill="#4d7c0f">EXPERIENCE</text>
    <text x="600" y="325" font-size="14" fill="#475569">Right product · content</text><text x="600" y="346" font-size="14" fill="#475569">channel · moment</text>

    <circle cx="830" cy="230" r="62" fill="#e7f8fb" stroke="#b9e3ea"/><text x="830" y="222" font-size="20" font-weight="700" fill="#0e7490">ENGAGE</text><text x="830" y="247" font-size="20" font-weight="700" fill="#0e7490">&amp; LEARN</text>
    <text x="830" y="325" font-size="14" fill="#475569">Interaction · loyalty</text><text x="830" y="346" font-size="14" fill="#475569">feedback · satisfaction</text>

    <circle cx="1060" cy="230" r="62" fill="#eef2ff" stroke="#c7d2fe"/><text x="1060" y="222" font-size="20" font-weight="700" fill="#3730a3">BUSINESS</text><text x="1060" y="247" font-size="20" font-weight="700" fill="#3730a3">VALUE</text>
    <text x="1060" y="325" font-size="14" fill="#475569">Revenue · AOV</text><text x="1060" y="346" font-size="14" fill="#475569">retention · efficiency</text>
