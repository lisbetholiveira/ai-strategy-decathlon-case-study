  <g stroke="#64748b" stroke-width="3" fill="#64748b">
    <line x1="205" y1="230" x2="300" y2="230"/><polygon points="296,222 312,230 296,238"/>
    <line x1="435" y1="230" x2="530" y2="230"/><polygon points="526,222 542,230 526,238"/>
    <line x1="665" y1="230" x2="760" y2="230"/><polygon points="756,222 772,230 756,238"/>
    <line x1="895" y1="230" x2="990" y2="230"/><polygon points="986,222 1002,230 986,238"/>
